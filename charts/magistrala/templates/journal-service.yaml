{{- if .Values.journal.enabled }}

apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-journal
spec:
  selector:
    app: {{ .Release.Name }}
    component: journal
  ports:
    - protocol: TCP
      port: {{ .Values.journal.httpPort }}
      name: {{ .Release.Name }}-journal-http
{{- end }}
